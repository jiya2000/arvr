<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Lumière — Immersive AR Dining Experience.">
    <meta name="theme-color" content="#29231F">

    <title>Lumière — Sensory Dining</title>
    
    <!-- ERROR LOGGER FOR DEBUGGING -->
    <script>
        window.addEventListener('error', function(e) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;background:red;color:white;padding:20px;font-family:monospace;width:100%;white-space:pre-wrap;';
            errDiv.innerHTML = '<strong>GLOBAL ERROR:</strong><br>' + e.message + '<br>File: ' + e.filename + '<br>Line: ' + e.lineno;
            if(document.body) document.body.appendChild(errDiv);
            else window.onload = () => document.body.appendChild(errDiv);
        });
        window.addEventListener('unhandledrejection', function(e) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:100px;left:0;z-index:99999;background:orange;color:white;padding:20px;font-family:monospace;width:100%;white-space:pre-wrap;';
            errDiv.innerHTML = '<strong>UNHANDLED PROMISE REJECTION:</strong><br>' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
            if(document.body) document.body.appendChild(errDiv);
            else window.onload = () => document.body.appendChild(errDiv);
        });
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- A-Frame and Extras -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    
    <!-- Custom Components -->
    <script src="js/spatial-ui.js"></script>
    <script src="js/ar-game.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <!-- Google Model Viewer (Keep for QuickLook fallback) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- UI Overlay (2D HUD) -->
    <div id="hud">
        <header class="hud-header">
            <h1 class="hud-brand">Lumière</h1>
            <p class="hud-subtitle">Spatial Menu</p>
        </header>
        
        <div id="intro-screen" class="hud-overlay active">
            <div class="hud-card">
                <h2>Welcome to the Future of Dining</h2>
                <p>Drag to look around, or tap below to enter the immersive experience. Tap dishes to explore.</p>
                <div class="hud-actions">
                    <button id="enter-ar-btn" class="btn btn--primary">Enter AR / VR</button>
                    <button id="explore-3d-btn" class="btn btn--secondary">Explore in 3D</button>
                </div>
            </div>
        </div>

        <div id="dish-info-panel" class="hud-panel bottom-panel">
            <button class="close-btn" id="close-info-btn">✕</button>
            <h3 id="info-title">Dish Name</h3>
            <p id="info-price">₹0</p>
            <p id="info-desc">Description goes here.</p>
            <div class="hud-actions">
                <button id="add-to-order-btn" class="btn btn--primary btn--full">Add to Order</button>
            </div>
        </div>

        <!-- Carousel Controls -->
        <div class="carousel-controls">
            <button id="prev-btn" class="nav-btn">←</button>
            <button id="next-btn" class="nav-btn">→</button>
        </div>
    </div>

    <!-- The WebXR Scene -->
    <a-scene 
        embedded
        id="main-scene"
        webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay; overlayElement: #hud"
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;"
        cursor="rayOrigin: mouse"
        raycaster="objects: .interactable"
        background="color: #29231F"
        style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;">
        
        <a-assets id="scene-assets">
            <img id="restaurant-pano" src="assets/restaurant_panorama.jpg" crossorigin="anonymous">
            <!-- Models injected dynamically by app.js -->
        </a-assets>

        <!-- Procedural Environment that morphs dynamically -->
        <a-entity id="environment-rig" dynamic-environment environment="preset: default; skyType: atmosphere; lighting: point; active: true"></a-entity>

        <!-- AR Mini-Game Rig -->
        <a-entity id="ar-game-rig" ingredient-rain></a-entity>

        <!-- Main Lighting (kept simple for performance) -->
        <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.8" castShadow="true"></a-light>

        <!-- Volumetric Cart Tray -->
        <a-entity id="ar-cart-tray" position="1.5 1 -1.5" rotation="0 -30 0" shadow="receive: true">
            <a-cylinder radius="0.8" height="0.05" color="#8b5a2b" material="roughness: 0.8"></a-cylinder>
            <a-text value="Your Order" position="0 0.5 0" align="center" width="4" color="#ffffff"></a-text>
            <a-text id="cart-total-3d" value="Total: $0.00" position="0 0.3 0" align="center" width="3" color="#ffaa00"></a-text>
            
            <!-- Action Buttons -->
            <a-entity class="interactable" id="checkout-3d-btn" position="-0.4 0.1 0.6" geometry="primitive: box; width: 0.4; height: 0.1; depth: 0.2" material="color: #4CAF50" animation__hover="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
                <a-text value="Checkout" position="0 0.06 0" rotation="-90 0 0" align="center" width="2" color="#FFF"></a-text>
            </a-entity>
            
            <a-entity class="interactable" id="clear-3d-btn" position="0.4 0.1 0.6" geometry="primitive: box; width: 0.4; height: 0.1; depth: 0.2" material="color: #F44336" animation__hover="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
                <a-text value="Clear" position="0 0.06 0" rotation="-90 0 0" align="center" width="2" color="#FFF"></a-text>
            </a-entity>
            <!-- Items will be spawned here as children -->
        </a-entity>

        <!-- Camera Rig -->
        <a-entity id="cameraRig" position="0 0 0">
            <a-camera id="camera" look-controls="magicWindowTrackingEnabled: false;" position="0 1.6 0">
                <!-- Reticle for AR/VR interaction -->
                <a-entity cursor="fuse: false"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: white; shader: flat; opacity: 0.8"
                          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                          show-in-vr>
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- Carousel Container -->
        <a-entity id="menu-carousel" position="0 1.2 -3" dish-carousel>
            <!-- Dishes injected here -->
        </a-entity>

        <!-- Magic Spice Portal (Easter Egg / Discovery) -->
        <a-entity id="spice-portal" class="interactable" position="3 1.5 -2" rotation="0 -45 0" spice-portal>
            <a-entity geometry="primitive: torus; radius: 0.8; tube: 0.05" material="color: #A45A3A; emissive: #A45A3A; emissiveIntensity: 0.5" animation="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear"></a-entity>
            <a-entity geometry="primitive: circle; radius: 0.75" material="color: #000; opacity: 0.8"></a-entity>
            <a-text value="Tap for\nSecret Menu" position="0 0 0.1" align="center" color="#FFF" scale="0.8 0.8 0.8"></a-text>
        </a-entity>
        
    </a-scene>

    <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
